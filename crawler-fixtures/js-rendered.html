<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript fixture shell</title>
  </head>
  <body>
    <main id="fixture-content">
      <p>JavaScript fixture loading shell.</p>
    </main>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.title = 'JavaScript rendered sapphire report';
        document.getElementById('fixture-content').innerHTML = `
          <h1>JavaScript rendered sapphire report</h1>
          <p>This content is inserted only after DOMContentLoaded so an HTTP-only extractor sees the loading shell.</p>
          <p>The rendered payload mentions a sapphire compass, four paper maps, and a synthetic expedition scheduled for Thursday.</p>
          <p>A browser-rendered crawl should store this complete report and its updated title.</p>
        `;
      });
    </script>
  </body>
</html>
